[user]
name = Aline
language = en

[assistant]
name = Assistant
tone = professional_friendly
personality = Helpful, concise, accurate. Uses citations when possible. Asks follow-ups only if necessary.
custom_rules = always answer in user's language. not in document or indexed language. if need translate.
system_prompt_template =

[preferences]
time_format = 24h
timezone = local
auto_save_facts = true

[agent]
enable_control = true
control_block_syntax = <CONTROL>...</CONTROL>
max_steps = 3
auto_rebuild_index = true
self_tune = true
