[paths]
base_dir = D:\offline_doc_assistant
data_dir = D:\offline_doc_assistant\data
index_dir = D:\offline_doc_assistant\data\index
log_dir = D:\offline_doc_assistant\data\logs
memory_dir = D:\offline_doc_assistant\data\memory
auto_docs_dir = D:\offline_doc_assistant\index
embed_model_dir = D:\offline_doc_assistant\models\embed
icons_dir = D:\offline_doc_assistant
app_icon_ico = D:\offline_doc_assistant\app.ico
app_icon_png = D:\offline_doc_assistant\logo.png
ui_logo_path = D:\offline_doc_assistant\logo.png

[index]
; Primary folders to watch/index
sources = D:\offline_doc_assistant\index
extra_sources =

; If include_globs is empty => index everything that matches supported_exts (minus excludes)
include_globs =
; Strong default excludes to avoid indexing junk / huge folders
exclude_globs = *.tmp; *.temp; ~*; ~$*; *.lock; *.bak; *.swp; *.swo; *.pyc; *.pyo; *.pyd; *.dll; *.exe; *.bin; *.iso; *.zip; *.7z; *.rar; *.tar; *.gz; *.bz2; *.xz; *.mp4; *.mkv; *.avi; *.mov; *.mp3; *.wav; *.flac; *.sqlite; *.db; *.parquet; *.feather; *.onnx; *.pt; *.pth

; Supported extensions (kept yours; this is fine)
supported_exts = .txt; .md; .mdx; .log; .ini; .cfg; .conf; .env; .xml; .yml; .yaml; .tsv; .tex; .py; .js; .ts; .tsx; .jsx; .java; .kt; .c; .h; .cpp; .hpp; .cs; .go; .rs; .rb; .php; .sql; .sh; .bat; .ps1; .toml; .gitignore; .pdf; .docx; .doc; .odt; .xlsx; .xls; .xlsm; .xltx; .xltm; .ods; .pptx; .ppt; .ppsx; .potx; .odp; .csv; .json; .jsonl; .ndjson; .html; .htm; .rtf; .epub; .png; .jpg; .jpeg; .bmp; .tif; .tiff

; WARNING: true allows scanning anywhere on disk if user supplies a path
allow_any_path = true

; Limits (200MB is okay for PDFs, but can be slow; 100–200 is typical)
max_file_mb = 200
; 0 = no limit; consider 2000+ for very large corpuses
max_docs_per_run = 0

; ✅ CHUNKING (fixed)
; chunk_size should be much bigger than overlap.
; Recommended for general docs: 800–1400 chars chunk, 120–220 overlap.
chunk_size = 1100
chunk_overlap = 180

; Embedding/index tuning (balanced)
embed_batch_size = 32
hnsw_m = 32
hnsw_ef_construction = 200
hnsw_ef_search = 128

[retrieval]
; 8–25 is usually enough; 100 can add noise & slow responses.
top_k = 20
min_score = 0.0
rerank = false

[ollama]
base_url = http://localhost:11434
model = phi4-mini-reasoning:latest
timeout_s = 600

[generation]
temperature = 0.2
top_p = 0.9
num_predict = 900

[ocr]
enable_ocr = true
; NOTE:
; - If you use Tesseract: use chi_sim (Simplified Chinese) or chi_tra
; - If you use something else, keep cn. Most setups prefer chi_sim.
lang = chi_sim
pdf_dpi = 250
; blank = no limit (can be slow). Example: 30 for speed.
max_pages =
poppler_path = D:\offline_doc_assistant\poppler\Library\bin
tesseract_exe = C:\Program Files\Tesseract-OCR\tesseract.exe
scanned_pdf_min_chars = 60

[libreoffice]
enable_libreoffice = true
timeout_s = 90
; If LibreOffice is installed but not in PATH, set full path to soffice.exe
; soffice_path = C:\Program Files\LibreOffice\program\soffice.exe
soffice_path =

[ui]
window_title = Document AI Assistant
always_on_top = true
min_width = 800
min_height = 800
logo_height_px = 65
status_template = Ready. Place documents in {auto_docs_dir} (OCR={ocr_status}, LibreOffice={libreoffice_status})

[agent]
enable_control = true
control_block_syntax = <CONTROL>...</CONTROL>
max_steps = 3
auto_rebuild_index = true
self_tune = true