[paths]
base_dir = D:\offline_doc_assistant
data_dir = D:\offline_doc_assistant\data
index_dir = D:\offline_doc_assistant\data\index
log_dir = D:\offline_doc_assistant\data\logs
memory_dir = D:\offline_doc_assistant\data\memory
auto_docs_dir = D:\offline_doc_assistant\index
embed_model_dir = D:\offline_doc_assistant\models\embed
icons_dir = D:\offline_doc_assistant
app_icon_ico = D:\offline_doc_assistant\app.ico
app_icon_png = D:\offline_doc_assistant\logo.png
ui_logo_path = D:\offline_doc_assistant\logo.png

[index]
sources = D:\offline_doc_assistant\index
extra_sources =
include_globs =
exclude_globs =
supported_exts = .txt; .md; .mdx; .log; .ini; .cfg; .conf; .env; .xml; .yml; .yaml; .tsv; .tex; .py; .js; .ts; .tsx; .jsx; .java; .kt; .c; .h; .cpp; .hpp; .cs; .go; .rs; .rb; .php; .sql; .sh; .bat; .ps1; .toml; .gitignore; .pdf; .docx; .doc; .odt; .xlsx; .xls; .xlsm; .xltx; .xltm; .ods; .pptx; .ppt; .ppsx; .potx; .odp; .csv; .json; .jsonl; .ndjson; .html; .htm; .rtf; .epub; .png; .jpg; .jpeg; .bmp; .tif; .tiff
allow_any_path = true
max_file_mb = 50
max_docs_per_run = 0
chunk_size = 1100
chunk_overlap = 220
embed_batch_size = 64
hnsw_m = 32
hnsw_ef_construction = 200
hnsw_ef_search = 64

[retrieval]
top_k = 6
min_score = 0.0
rerank = false

[ollama]
base_url = http://localhost:11434
model = qwen2.5:7b-instruct
timeout_s = 600

[generation]
temperature = 0.2
top_p = 0.9
num_predict = 900

[ocr]
enable_ocr = true
lang = auto
pdf_dpi = 250
max_pages =
poppler_path = D:\offline_doc_assistant\poppler\Library\bin
tesseract_exe = C:\Program Files\Tesseract-OCR\tesseract.exe
scanned_pdf_min_chars = 60

[libreoffice]
enable_libreoffice = true
timeout_s = 90
soffice_path =

[ui]
window_title = Document AI Assistant
always_on_top = true
min_width = 800
min_height = 800
logo_height_px = 65
status_template = Ready. Place documents in {auto_docs_dir} (OCR={ocr_status}, LibreOffice={libreoffice_status})

[agent]
enable_control = true
control_block_syntax = <CONTROL>...</CONTROL>
max_steps = 3
auto_rebuild_index = true
self_tune = true
