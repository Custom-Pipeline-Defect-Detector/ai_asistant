version: '3.9'
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: aline
      POSTGRES_USER: aline
      POSTGRES_PASSWORD: aline
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - '5432:5432'

  redis:
    image: redis:7
    ports:
      - '6379:6379'

  backend:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://aline:aline@postgres:5432/aline
      JWT_SECRET: change-me
      FILE_STORAGE_ROOT: /data/aline_docs
      OLLAMA_URL: http://host.docker.internal:11434
      OLLAMA_MODEL: qwen2.5:7b-instruct
      REDIS_URL: redis://redis:6379/0
      WATCH_PATHS: /data/aline_docs
    volumes:
      - docdata:/data/aline_docs
    depends_on:
      - postgres
      - redis
    ports:
      - '8000:8000'

  worker:
    build:
      context: ./backend
    command: celery -A app.worker.celery_app.celery worker --loglevel=info
    environment:
      DATABASE_URL: postgresql+psycopg://aline:aline@postgres:5432/aline
      JWT_SECRET: change-me
      FILE_STORAGE_ROOT: /data/aline_docs
      OLLAMA_URL: http://host.docker.internal:11434
      OLLAMA_MODEL: qwen2.5:7b-instruct
      REDIS_URL: redis://redis:6379/0
    volumes:
      - docdata:/data/aline_docs
    depends_on:
      - postgres
      - redis

  watcher:
    build:
      context: ./watcher
    environment:
      DATABASE_URL: postgresql+psycopg://aline:aline@postgres:5432/aline
      REDIS_URL: redis://redis:6379/0
      FILE_STORAGE_ROOT: /data/aline_docs
      WATCH_PATHS: /data/aline_docs
    volumes:
      - docdata:/data/aline_docs
    depends_on:
      - postgres
      - redis

  frontend:
    build:
      context: ./frontend
    ports:
      - '5173:5173'
    environment:
      VITE_API_BASE: http://localhost:8000
    depends_on:
      - backend

volumes:
  pgdata:
  docdata:
